services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: support-flow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-support_flow}
      MYSQL_USER: ${DB_USERNAME:-support_flow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-support_flow_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${DB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - support-flow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  support-flow-mysql-data:
